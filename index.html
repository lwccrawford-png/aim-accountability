<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accountability v1</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --border: #e2e8f0;
      --primary: #0f172a;
      --danger: #dc2626;
      --blue: #2563eb;
      --green: #16a34a;
      --amber: #d97706;
      --red: #dc2626;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background: var(--bg);
      color: var(--text);
    }
    .container { max-width: 1080px; margin: 0 auto; padding: 16px; }
    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 10;
    }
    .row { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
    .nav { display: flex; gap: 8px; flex-wrap: wrap; }
    .nav a {
      text-decoration: none; color: var(--muted);
      padding: 8px 12px; border-radius: 8px;
      border: 1px solid transparent;
    }
    .nav a.active { background: var(--primary); color: white; }
    .nav a:hover { background: #f1f5f9; }

    h1 { font-size: 20px; margin: 0; }
    h2 { font-size: 26px; margin: 0 0 16px; }
    h3 { font-size: 18px; margin: 0 0 12px; }

    .grid { display: grid; gap: 12px; }
    .grid-3 { grid-template-columns: repeat(1, minmax(0, 1fr)); }
    .grid-2 { grid-template-columns: repeat(1, minmax(0, 1fr)); }
    @media (min-width: 768px) { .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (min-width: 900px) { .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
    }

    .muted { color: var(--muted); }
    .small { font-size: 13px; }
    .tiny { font-size: 12px; }
    .stack { display: grid; gap: 10px; }
    .btn {
      border: 1px solid var(--border);
      background: white;
      color: var(--text);
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }
    .btn.primary { background: var(--primary); color: white; border-color: var(--primary); }
    .btn.danger { color: var(--danger); }
    .btn.blue { color: var(--blue); }
    .badge { font-size: 12px; background: #f1f5f9; padding: 4px 8px; border-radius: 8px; }

    input, textarea, select {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 8px 10px;
      font: inherit;
      color: var(--text);
      background: white;
    }
    textarea { resize: vertical; min-height: 80px; }
    label { font-size: 14px; font-weight: 600; display: block; margin-bottom: 6px; }
    .field { margin-bottom: 12px; }
    .error { color: var(--danger); font-size: 13px; margin-top: 8px; }
    .line { border-top: 1px solid var(--border); margin: 10px 0; }

    .item {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      background: white;
    }
    .item-top { display: flex; gap: 8px; justify-content: space-between; align-items: flex-start; }
    .actions { display: flex; gap: 8px; }
    .strike { text-decoration: line-through; color: #64748b; }

    .empty { text-align: center; border: 1px dashed #cbd5e1; }
    .status-on { color: var(--green); }
    .status-risk { color: var(--amber); }
    .status-off { color: var(--red); }
    .wrap { word-break: break-word; }
  </style>
</head>
<body>
  <header>
    <div class="container row">
      <h1>Accountability</h1>
      <nav class="nav">
        <a href="#/" data-route="/">Dashboard</a>
        <a href="#/new" data-route="/new">Create Goal</a>
        <a href="#/archived" data-route="/archived">Archived</a>
      </nav>
    </div>
  </header>

  <main class="container" id="app"></main>

  <script>
    const STORAGE_KEY = "accountability-v1-state";

    /** @typedef {'On Track'|'At Risk'|'Off Track'} GoalStatus */
    /** @typedef {'7-day-sprint'|'30-day-goal'|'custom'} GoalStructure */

    const statusOptions = ["On Track", "At Risk", "Off Track"];

    function createId(prefix = "id") {
      return `${prefix}-${Date.now()}-${Math.random().toString(36).slice(2, 9)}`;
    }

    function isoDate(d) {
      const dt = new Date(d);
      return dt.toISOString().split("T")[0];
    }

    function formatDate(ts) {
      const d = new Date(ts);
      return d.toLocaleString();
    }

    function addDays(base, days) {
      const d = new Date(base);
      d.setDate(d.getDate() + days);
      return d;
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return { goals: [] };
        const parsed = JSON.parse(raw);
        if (!parsed || !Array.isArray(parsed.goals)) return { goals: [] };
        return parsed;
      } catch {
        return { goals: [] };
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    const state = loadState();

    function createGoal({ title, description, structureType, milestoneCount }) {
      const now = new Date();
      const goal = {
        id: createId("goal"),
        title,
        description: description || "",
        structureType,
        status: "On Track",
        archived: false,
        createdAt: now.toISOString(),
        tasks: [],
        milestones: [],
        updates: [{
          id: createId("update"),
          timestamp: now.toISOString(),
          status: "On Track",
          note: "Goal created."
        }]
      };

      if (structureType === "7-day-sprint") {
        for (let i = 0; i < 7; i++) {
          goal.tasks.push({
            id: createId("task"),
            title: `Day ${i + 1} task`,
            completed: false,
            dueDate: isoDate(addDays(now, i)),
            createdAt: now.toISOString()
          });
        }
      }

      if (structureType === "30-day-goal") {
        const spacing = milestoneCount === 6 ? [5,10,15,20,25,30] : [7,14,21,30];
        spacing.forEach((day, idx) => {
          goal.milestones.push({
            id: createId("milestone"),
            title: `Milestone ${idx + 1}`,
            completed: false,
            targetDate: isoDate(addDays(now, day)),
            createdAt: now.toISOString()
          });
        });
      }

      state.goals.unshift(goal);
      saveState();
    }

    function getGoal(goalId) {
      return state.goals.find(g => g.id === goalId);
    }

    function statusClass(status) {
      if (status === "On Track") return "status-on";
      if (status === "At Risk") return "status-risk";
      return "status-off";
    }

    function setActiveNav(route) {
      document.querySelectorAll("[data-route]").forEach(a => {
        a.classList.toggle("active", a.getAttribute("data-route") === route);
      });
    }

    function renderDashboard() {
      setActiveNav("/");
      const goals = state.goals.filter(g => !g.archived);

      if (!goals.length) {
        return `
          <section class="stack">
            <h2>Active Goals</h2>
            <div class="card empty">
              <h3>No active goals yet</h3>
              <p class="muted">Start your first sprint or goal.</p>
              <a class="btn primary" href="#/new" style="display:inline-block;text-decoration:none;margin-top:8px;">Create Goal</a>
            </div>
          </section>
        `;
      }

      return `
        <section class="stack">
          <h2>Active Goals</h2>
          <div class="grid grid-3">
            ${goals.map(g => `
              <article class="card">
                <div class="row" style="align-items:flex-start;">
                  <strong class="wrap">${escapeHtml(g.title)}</strong>
                  <span class="badge ${statusClass(g.status)}">${g.status}</span>
                </div>
                ${g.description ? `<p class="muted small wrap">${escapeHtml(g.description)}</p>` : ""}
                <div class="tiny muted stack" style="gap:4px;">
                  <div>Structure: ${g.structureType}</div>
                  <div>Tasks: ${g.tasks.filter(t => t.completed).length}/${g.tasks.length}</div>
                  <div>Milestones: ${g.milestones.filter(m => m.completed).length}/${g.milestones.length}</div>
                  <div>Created: ${formatDate(g.createdAt)}</div>
                </div>
                <div style="margin-top:10px;">
                  <a class="btn" href="#/goal/${g.id}" style="text-decoration:none;display:inline-block;">Open Goal</a>
                </div>
              </article>
            `).join("")}
          </div>
        </section>
      `;
    }

    function renderArchived() {
      setActiveNav("/archived");
      const goals = state.goals.filter(g => g.archived);

      if (!goals.length) {
        return `
          <section class="stack">
            <h2>Archived Goals</h2>
            <div class="card empty">
              <h3>No archived goals</h3>
              <p class="muted">Archived goals will appear here.</p>
            </div>
          </section>
        `;
      }

      return `
        <section class="stack">
          <h2>Archived Goals</h2>
          <div class="grid grid-3">
            ${goals.map(g => `
              <article class="card">
                <div class="row" style="align-items:flex-start;">
                  <strong class="wrap">${escapeHtml(g.title)}</strong>
                  <span class="badge ${statusClass(g.status)}">${g.status}</span>
                </div>
                ${g.description ? `<p class="muted small wrap">${escapeHtml(g.description)}</p>` : ""}
                <div class="tiny muted">Created: ${formatDate(g.createdAt)}</div>
                <div style="margin-top:10px;">
                  <a class="btn" href="#/goal/${g.id}" style="text-decoration:none;display:inline-block;">Open Goal</a>
                </div>
              </article>
            `).join("")}
          </div>
        </section>
      `;
    }

    function renderCreateGoal() {
      setActiveNav("/new");
      return `
        <section class="stack" style="max-width:740px;">
          <h2>Create Goal</h2>
          <form id="createGoalForm" class="card">
            <div class="field">
              <label>Title <span style="color:var(--danger)">*</span></label>
              <input id="goalTitle" required />
            </div>
            <div class="field">
              <label>Description (optional)</label>
              <textarea id="goalDescription"></textarea>
            </div>
            <div class="field">
              <label>Structure type</label>
              <div class="stack small" style="gap:6px;">
                <label style="font-weight:400;"><input type="radio" name="structureType" value="7-day-sprint" checked /> 7-Day Sprint (auto-creates 7 daily tasks)</label>
                <label style="font-weight:400;"><input type="radio" name="structureType" value="30-day-goal" /> 30-Day Goal (auto-creates milestones)</label>
                <label style="font-weight:400;"><input type="radio" name="structureType" value="custom" /> Custom (starts empty)</label>
              </div>
            </div>
            <div class="field" id="milestoneCountWrap" style="display:none;">
              <label>30-Day milestones</label>
              <select id="milestoneCount">
                <option value="4">4 milestones</option>
                <option value="6">6 milestones</option>
              </select>
            </div>
            <button class="btn primary" type="submit">Create Goal</button>
            <div id="createError" class="error"></div>
          </form>
        </section>
      `;
    }

    function renderGoalDetail(goalId) {
      const goal = getGoal(goalId);
      if (!goal) {
        setActiveNav("");
        return `
          <section class="stack">
            <h2>Goal not found</h2>
            <a href="#/" class="btn" style="text-decoration:none;display:inline-block;width:max-content;">Back to dashboard</a>
          </section>
        `;
      }

      setActiveNav("");
      return `
        <section class="stack">
          <div class="card stack">
            <div class="row">
              <h2 style="margin:0;" class="wrap">${escapeHtml(goal.title)}</h2>
              <button class="btn" id="toggleArchiveBtn">${goal.archived ? "Unarchive Goal" : "Archive Goal"}</button>
            </div>
            ${goal.description ? `<p class="muted wrap">${escapeHtml(goal.description)}</p>` : ""}
            <div class="field" style="margin-bottom:0;">
              <label>Status</label>
              <select id="goalStatusSelect">
                ${statusOptions.map(s => `<option ${goal.status === s ? "selected" : ""}>${s}</option>`).join("")}
              </select>
            </div>
          </div>

          <div class="grid grid-2">
            <div class="card stack">
              <h3>Tasks</h3>
              <form id="addTaskForm" class="row" style="align-items:end;">
                <div style="flex:1;min-width:180px;">
                  <label style="font-weight:500;">Task title</label>
                  <input id="taskTitle" required />
                </div>
                <div style="min-width:170px;">
                  <label style="font-weight:500;">Due date</label>
                  <input id="taskDueDate" type="date" />
                </div>
                <button class="btn primary" type="submit">Add</button>
              </form>
              <div class="stack">
                ${goal.tasks.length ? goal.tasks.map(t => `
                  <div class="item">
                    <div class="item-top">
                      <label style="font-weight:500;">
                        <input type="checkbox" data-task-toggle="${t.id}" ${t.completed ? "checked" : ""} />
                        <span class="${t.completed ? "strike" : ""} wrap">${escapeHtml(t.title)}</span>
                      </label>
                      <div class="actions">
                        <button class="btn blue" data-task-edit="${t.id}" type="button">Edit</button>
                        <button class="btn danger" data-task-delete="${t.id}" type="button">Delete</button>
                      </div>
                    </div>
                    ${t.dueDate ? `<div class="tiny muted">Due: ${t.dueDate}</div>` : ""}
                  </div>
                `).join("") : `<p class="muted small">No tasks yet.</p>`}
              </div>
            </div>

            <div class="card stack">
              <h3>Milestones</h3>
              <form id="addMilestoneForm" class="row" style="align-items:end;">
                <div style="flex:1;min-width:180px;">
                  <label style="font-weight:500;">Milestone title</label>
                  <input id="milestoneTitle" required />
                </div>
                <div style="min-width:170px;">
                  <label style="font-weight:500;">Target date</label>
                  <input id="milestoneDate" type="date" />
                </div>
                <button class="btn primary" type="submit">Add</button>
              </form>
              <div class="stack">
                ${goal.milestones.length ? goal.milestones.map(m => `
                  <div class="item">
                    <div class="item-top">
                      <label style="font-weight:500;">
                        <input type="checkbox" data-milestone-toggle="${m.id}" ${m.completed ? "checked" : ""} />
                        <span class="${m.completed ? "strike" : ""} wrap">${escapeHtml(m.title)}</span>
                      </label>
                      <div class="actions">
                        <button class="btn blue" data-milestone-edit="${m.id}" type="button">Edit</button>
                        <button class="btn danger" data-milestone-delete="${m.id}" type="button">Delete</button>
                      </div>
                    </div>
                    ${m.targetDate ? `<div class="tiny muted">Target: ${m.targetDate}</div>` : ""}
                  </div>
                `).join("") : `<p class="muted small">No milestones yet.</p>`}
              </div>
            </div>
          </div>

          <div class="card stack">
            <h3>Update Feed</h3>
            <form id="addUpdateForm" class="stack">
              <div class="field" style="margin-bottom:0;">
                <label>Status</label>
                <select id="updateStatus">
                  ${statusOptions.map(s => `<option ${goal.status === s ? "selected" : ""}>${s}</option>`).join("")}
                </select>
              </div>
              <div class="field" style="margin-bottom:0;">
                <label>Note</label>
                <textarea id="updateNote" required></textarea>
              </div>
              <button class="btn primary" type="submit" style="width:max-content;">Add Update</button>
            </form>
            <div class="stack">
              ${goal.updates.length ? goal.updates.map(u => `
                <div class="item">
                  <div class="row tiny muted">
                    <span class="${statusClass(u.status)}">${u.status}</span>
                    <span>${formatDate(u.timestamp)}</span>
                  </div>
                  <p class="small wrap" style="margin:8px 0 0;">${escapeHtml(u.note)}</p>
                </div>
              `).join("") : `<p class="muted small">No updates yet.</p>`}
            </div>
          </div>
        </section>
      `;
    }

    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function currentRoute() {
      const hash = location.hash.replace(/^#/, "") || "/";
      if (hash.startsWith("/goal/")) return { page: "goal", goalId: hash.split("/")[2] };
      if (hash === "/new") return { page: "new" };
      if (hash === "/archived") return { page: "archived" };
      return { page: "dashboard" };
    }

    function render() {
      const app = document.getElementById("app");
      const route = currentRoute();

      if (route.page === "new") app.innerHTML = renderCreateGoal();
      else if (route.page === "archived") app.innerHTML = renderArchived();
      else if (route.page === "goal") app.innerHTML = renderGoalDetail(route.goalId);
      else app.innerHTML = renderDashboard();

      bindEvents();
    }

    function bindEvents() {
      const route = currentRoute();

      // Create Goal
      const createForm = document.getElementById("createGoalForm");
      if (createForm) {
        const radios = [...document.querySelectorAll('input[name="structureType"]')];
        const milestoneWrap = document.getElementById("milestoneCountWrap");

        function syncMilestoneWrap() {
          const val = (document.querySelector('input[name="structureType"]:checked') || {}).value;
          milestoneWrap.style.display = val === "30-day-goal" ? "block" : "none";
        }
        radios.forEach(r => r.addEventListener("change", syncMilestoneWrap));
        syncMilestoneWrap();

        createForm.addEventListener("submit", (e) => {
          e.preventDefault();
          const title = document.getElementById("goalTitle").value.trim();
          const description = document.getElementById("goalDescription").value.trim();
          const structureType = document.querySelector('input[name="structureType"]:checked').value;
          const milestoneCount = Number(document.getElementById("milestoneCount").value);
          const err = document.getElementById("createError");

          if (!title) {
            err.textContent = "Title is required.";
            return;
          }

          createGoal({ title, description, structureType, milestoneCount });
          location.hash = "#/";
        });
      }

      // Goal detail actions
      if (route.page === "goal") {
        const goal = getGoal(route.goalId);
        if (!goal) return;

        const archiveBtn = document.getElementById("toggleArchiveBtn");
        archiveBtn?.addEventListener("click", () => {
          goal.archived = !goal.archived;
          saveState();
          render();
        });

        const statusSelect = document.getElementById("goalStatusSelect");
        statusSelect?.addEventListener("change", (e) => {
          goal.status = e.target.value;
          saveState();
          render();
        });

        document.getElementById("addTaskForm")?.addEventListener("submit", (e) => {
          e.preventDefault();
          const title = document.getElementById("taskTitle").value.trim();
          const dueDate = document.getElementById("taskDueDate").value;
          if (!title) return;
          goal.tasks.push({
            id: createId("task"),
            title,
            completed: false,
            dueDate: dueDate || "",
            createdAt: new Date().toISOString()
          });
          saveState();
          render();
        });

        document.querySelectorAll("[data-task-toggle]").forEach(el => {
          el.addEventListener("change", () => {
            const task = goal.tasks.find(t => t.id === el.getAttribute("data-task-toggle"));
            if (!task) return;
            task.completed = !task.completed;
            saveState();
            render();
          });
        });

        document.querySelectorAll("[data-task-delete]").forEach(el => {
          el.addEventListener("click", () => {
            const id = el.getAttribute("data-task-delete");
            goal.tasks = goal.tasks.filter(t => t.id !== id);
            saveState();
            render();
          });
        });

        document.querySelectorAll("[data-task-edit]").forEach(el => {
          el.addEventListener("click", () => {
            const id = el.getAttribute("data-task-edit");
            const task = goal.tasks.find(t => t.id === id);
            if (!task) return;
            const next = prompt("Edit task title", task.title);
            if (!next || !next.trim()) return;
            task.title = next.trim();
            saveState();
            render();
          });
        });

        document.getElementById("addMilestoneForm")?.addEventListener("submit", (e) => {
          e.preventDefault();
          const title = document.getElementById("milestoneTitle").value.trim();
          const targetDate = document.getElementById("milestoneDate").value;
          if (!title) return;
          goal.milestones.push({
            id: createId("milestone"),
            title,
            completed: false,
            targetDate: targetDate || "",
            createdAt: new Date().toISOString()
          });
          saveState();
          render();
        });

        document.querySelectorAll("[data-milestone-toggle]").forEach(el => {
          el.addEventListener("change", () => {
            const m = goal.milestones.find(x => x.id === el.getAttribute("data-milestone-toggle"));
            if (!m) return;
            m.completed = !m.completed;
            saveState();
            render();
          });
        });

        document.querySelectorAll("[data-milestone-delete]").forEach(el => {
          el.addEventListener("click", () => {
            const id = el.getAttribute("data-milestone-delete");
            goal.milestones = goal.milestones.filter(m => m.id !== id);
            saveState();
            render();
          });
        });

        document.querySelectorAll("[data-milestone-edit]").forEach(el => {
          el.addEventListener("click", () => {
            const id = el.getAttribute("data-milestone-edit");
            const m = goal.milestones.find(x => x.id === id);
            if (!m) return;
            const next = prompt("Edit milestone title", m.title);
            if (!next || !next.trim()) return;
            m.title = next.trim();
            saveState();
            render();
          });
        });

        document.getElementById("addUpdateForm")?.addEventListener("submit", (e) => {
          e.preventDefault();
          const status = document.getElementById("updateStatus").value;
          const note = document.getElementById("updateNote").value.trim();
          if (!note) return;
          goal.status = status;
          goal.updates.unshift({
            id: createId("update"),
            timestamp: new Date().toISOString(),
            status,
            note
          });
          saveState();
          render();
        });
      }
    }

    window.addEventListener("hashchange", render);
    if (!location.hash) location.hash = "#/";
    render();
  </script>
</body>
</html>
